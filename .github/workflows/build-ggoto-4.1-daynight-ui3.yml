name: Build Ggotobrowser 4.1 (Normal-Day-Night Visual Mod)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v5

      - name: Checkout verified official GotoBrowser 4.1 source
        uses: actions/checkout@v5
        with:
          repository: antest1/GotoBrowser
          ref: 6e78d276f0c884e80c2a5a03a0de5973a42ae969
          path: _official
          persist-credentials: false

      - name: Verify official 4.1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'app/build.gradle': 'b12f67ae475a6033b9572396d6aa85b7dffbca4b164d567dea3292df6c12d90e',
            'app/src/main/java/com/antest1/gotobrowser/Browser/ResourceProcess.java': 'ce24a99ec23445bd95e2671587e57defbf05b1bc64b8c7eaddd0519d9b177081',
            'app/src/main/java/com/antest1/gotobrowser/Browser/KcsInterface.java': 'aaa9508ec62f2e7eb74d40c039c2a1041274a8f39e0967e1bb6d4ba629fd214a',
            'app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java': 'c367148064f37eec189f8b800f62a78d7a0e78a344024e9744c40bee73620ae5',
            'app/src/main/java/com/antest1/gotobrowser/ui/component/SettingsBottomSheet.kt': '4541f9f3b9ca3666a57fe7d77b64101c0d4c662bf38ff3472dfe210b52c53901',
            'app/src/main/java/com/antest1/gotobrowser/Activity/BrowserActivity.kt': '6738bd45a356efed4da00b5c398e440dd6027eed99a241847c2b97d2d766907b',
            'app/src/main/java/com/antest1/gotobrowser/Constants.java': 'cf03107b30fe355365d0574fd45a17ef340b38162dc2d23dd9770a582d8f8df8',
          }
          for rel, digest in expected.items():
            path = Path('_official') / rel
            if not path.is_file():
              raise SystemExit(f'MISSING official source file: {rel}')
            actual = hashlib.sha256(path.read_bytes()).hexdigest()
            print(f'{rel}: {"OK" if actual == digest else "MISMATCH"}')
            if actual != digest:
              raise SystemExit(f'Official source mismatch: {rel}')
          print('Official GotoBrowser 4.1 source snapshot verified.')
          PY

      - name: Locate and apply GGoto day-night patch
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Repository files (first 120) ==='
          find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -120

          PATCH_ZIP="$(find . -type f -name 'Ggoto_41_DayNight_UI3_Patch.zip' -not -path './_official/*' -print -quit)"

          if [ -z "$PATCH_ZIP" ]; then
            while IFS= read -r OUTER_ZIP; do
              [ -n "$OUTER_ZIP" ] || continue
              if unzip -Z1 "$OUTER_ZIP" 2>/dev/null | grep -q 'Ggoto_41_DayNight_UI3_Patch.zip$'; then
                echo "Found an upload archive containing the patch: $OUTER_ZIP"
                rm -rf _ggoto_outer
                mkdir -p _ggoto_outer
                unzip -q "$OUTER_ZIP" -d _ggoto_outer
                PATCH_ZIP="$(find _ggoto_outer -type f -name 'Ggoto_41_DayNight_UI3_Patch.zip' -print -quit)"
                break
              fi
            done < <(find . -maxdepth 3 -type f -name '*.zip' -not -path './_official/*' -not -path './_ggoto_patch/*' -not -path './.git/*' -print)
          fi

          if [ -z "$PATCH_ZIP" ]; then
            echo '::error title=GGoto patch ZIP missing::Upload Ggoto_41_DayNight_UI3_Patch.zip to the repository root, or upload Ggoto_41_DayNight_UI3_GitHubUploadPack.zip.'
            echo 'Expected patch filename: Ggoto_41_DayNight_UI3_Patch.zip'
            exit 2
          fi

          echo "Using patch archive: $PATCH_ZIP"
          rm -rf _ggoto_patch
          mkdir -p _ggoto_patch
          unzip -q "$PATCH_ZIP" -d _ggoto_patch

          PATCH_SCRIPT="$(find _ggoto_patch -type f -name 'patch_source41_daynight.py' -print -quit)"
          if [ -z "$PATCH_SCRIPT" ]; then
            echo '::error title=Patch script missing::The ZIP does not contain ggoto-patch/patch_source41_daynight.py.'
            find _ggoto_patch -maxdepth 5 -type f -print
            exit 3
          fi

          echo "Running patch script: $PATCH_SCRIPT"
          python3 "$PATCH_SCRIPT" _official

          ACTIVITY='_official/app/src/main/java/com/antest1/gotobrowser/Activity/BrowserActivity.kt'
          SETTINGS='_official/app/src/main/java/com/antest1/gotobrowser/ui/component/SettingsBottomSheet.kt'
          GRADLE='_official/app/build.gradle'
          grep -q 'PREF_MOD_GGOTO_PROFILE' "$ACTIVITY" || { echo 'GGOTO profile preference missing from BrowserActivity'; exit 4; }
          grep -q 'settings_mod_ggoto_profile' "$SETTINGS" || { echo 'GGOTO profile UI missing from SettingsBottomSheet'; exit 5; }
          grep -q '4.1-GGOTO-UI3' "$GRADLE" || { echo 'GGOTO version marker missing'; exit 6; }
          echo 'GGOTO patch application and UI checks passed.'

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure optional persistent debug signing key
        shell: bash
        env:
          GGOTO_DEBUG_KEYSTORE_B64: ${{ secrets.GGOTO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GGOTO_DEBUG_KEYSTORE_B64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$GGOTO_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Using persistent debug keystore.'
          else
            echo 'No persistent key configured; uninstall previous custom debug build if Android reports a signature mismatch.'
          fi

      - name: Build Ggotobrowser APK
        working-directory: _official
        shell: bash
        run: |
          set -euo pipefail
