name: Build Ggotobrowser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Ggotobrowser coordinate mod
        run: |
          rm -rf _ggmod
          mkdir -p _ggmod

          unzip -q Ggotobrowser_coord_mod_patch_v0.1.zip -d _ggmod

          python _ggmod/Ggotobrowser_coord_mod_patch/apply_patch.py "$GITHUB_WORKSPACE"

      - name: Remove Firebase from experimental build
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1. Remove Firebase Gradle plugins and libraries
          gradle = Path("app/build.gradle")
          text = gradle.read_text(encoding="utf-8")

          remove_lines = [
              "apply plugin: 'com.google.gms.google-services'",
              "apply plugin: 'com.google.firebase.crashlytics'",
              "implementation 'com.google.firebase:firebase-crashlytics:19.4.3'",
              "implementation 'com.google.firebase:firebase-analytics:22.4.0'",
          ]

          for line in remove_lines:
              text = text.replace(line + "\n", "")

          gradle.write_text(text, encoding="utf-8")

          # 2. Remove Crashlytics references from KcUtils.java
          kcutils = Path(
              "app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java"
          )
          text = kcutils.read_text(encoding="utf-8")

          text = text.replace(
              "import com.google.firebase.crashlytics.FirebaseCrashlytics;\n",
              ""
          )

          text = text.replace(
              "    private static final FirebaseCrashlytics crashlytics = FirebaseCrashlytics.getInstance();\n",
              ""
          )

          text = text.replace(
              "        crashlytics.recordException(e);\n",
              ""
          )

          kcutils.write_text(text, encoding="utf-8")

          print("Firebase and Crashlytics references removed.")
          PY

          rm -f app/google-services.json
          rm -f app/src/debug/google-services.json

          echo "===== VERIFY FIREBASE ====="
          if grep -R "FirebaseCrashlytics\|firebase-crashlytics\|firebase-analytics\|google-services" \
            app/build.gradle \
            app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java; then
            echo "ERROR: Firebase references still exist"
            exit 1
          else
            echo "Firebase references successfully removed"
          fi

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Build Ggotobrowser APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "===== APK files ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Ggotobrowser APK
        uses: actions/upload-artifact@v4
        with:
          name: Ggotobrowser-v0.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
