name: Build Ggotobrowser v0.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Ggotobrowser v0.3 mod
        run: |
          rm -rf _ggmod
          mkdir -p _ggmod
          unzip -q Ggotobrowser_v0.3_patch.zip -d _ggmod
          python _ggmod/Ggotobrowser_v0.3_patch/apply_patch.py "$GITHUB_WORKSPACE"

      - name: Remove Firebase from experimental debug build
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          lines = gradle.read_text(encoding='utf-8').splitlines(True)
          blocked = (
              'com.google.gms.google-services',
              'com.google.firebase.crashlytics',
              'com.google.firebase:firebase-crashlytics',
              'com.google.firebase:firebase-analytics',
          )
          gradle.write_text(''.join(x for x in lines if not any(b in x for b in blocked)), encoding='utf-8')

          kcutils = Path('app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java')
          lines = kcutils.read_text(encoding='utf-8').splitlines(True)
          blocked_java = ('FirebaseCrashlytics', 'crashlytics.recordException')
          kcutils.write_text(''.join(x for x in lines if not any(b in x for b in blocked_java)), encoding='utf-8')
          PY

          rm -f app/google-services.json app/src/debug/google-services.json

          if grep -R "FirebaseCrashlytics\|firebase-crashlytics\|firebase-analytics\|google-services" app/build.gradle app/src/main/java; then
            echo "ERROR: Firebase references still exist"
            exit 1
          fi

      - name: Run v0.3 patch tests
        run: |
          python _ggmod/Ggotobrowser_v0.3_patch/tests/test_logic_v03.py

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Build Ggotobrowser v0.3 APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload Ggotobrowser v0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ggotobrowser-v0.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
