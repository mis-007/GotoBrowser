name: Build Ggotobrowser 4.1 (exact source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout your patch files
        uses: actions/checkout@v5

      # SHA from the user's GotoBrowser-4.1.zip source archive, not a guessed tag.
      - name: Checkout verified official 4.1 source
        uses: actions/checkout@v5
        with:
          repository: antest1/GotoBrowser
          ref: 6e78d276f0c884e80c2a5a03a0de5973a42ae969
          path: _official
          persist-credentials: false

      - name: Verify official 4.1 files match uploaded source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'app/build.gradle': 'b12f67ae475a6033b9572396d6aa85b7dffbca4b164d567dea3292df6c12d90e',
            'app/src/main/java/com/antest1/gotobrowser/Browser/ResourceProcess.java': 'ce24a99ec23445bd95e2671587e57defbf05b1bc64b8c7eaddd0519d9b177081',
            'app/src/main/java/com/antest1/gotobrowser/Browser/KcsInterface.java': 'aaa9508ec62f2e7eb74d40c039c2a1041274a8f39e0967e1bb6d4ba629fd214a',
            'app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java': 'c367148064f37eec189f8b800f62a78d7a0e78a344024e9744c40bee73620ae5',
          }
          for rel, digest in expected.items():
            path = Path('_official')/rel
            got = hashlib.sha256(path.read_bytes()).hexdigest()
            print(f'{rel}  {"OK" if got==digest else "MISMATCH"}')
            if got != digest:
              raise SystemExit(f'Official file differs from user-uploaded 4.1: {rel}')
          PY

      - name: Apply exact 4.1 GGoto visual patch
        shell: bash
        run: |
          set -euo pipefail
          test -f GGoto_41_ExactSourcePatch.zip
          rm -rf _ggoto_patch
          mkdir _ggoto_patch
          unzip -q GGoto_41_ExactSourcePatch.zip -d _ggoto_patch
          python3 _ggoto_patch/ggoto-patch/patch_source41.py _official
          grep -n 'GGOTO-HACK-4.1' _official/app/src/main/java/com/antest1/gotobrowser/Browser/ResourceProcess.java

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure stable debug signing if supplied
        shell: bash
        env:
          GGOTO_DEBUG_KEYSTORE_B64: ${{ secrets.GGOTO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$GGOTO_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$GGOTO_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Using persistent debug keystore.'
          else
            echo 'No fixed debug key: backup before replacing your currently installed APK.'
          fi

      - name: Compile modified Ggotobrowser 4.1
        working-directory: _official
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Check generated APK
        shell: bash
        run: |
          set -euo pipefail
          find _official/app/build/outputs/apk/debug -name '*.apk' -type f -print
          test -n "$(find _official/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload Ggotobrowser 4.1 APK
        uses: actions/upload-artifact@v6
        with:
          name: Ggotobrowser-4.1-ExactSource-APK
          path: _official/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
