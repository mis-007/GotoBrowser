name: Build Ggotobrowser 4.1 (UI5.1 Upgrade Install + Auto Day Night)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload GGoto APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout your patch repository
        uses: actions/checkout@v5
        with:
          path: _patch_repo
          persist-credentials: false

      - name: Checkout verified official GotoBrowser 4.1 source
        uses: actions/checkout@v5
        with:
          repository: antest1/GotoBrowser
          ref: 6e78d276f0c884e80c2a5a03a0de5973a42ae969
          path: _official
          persist-credentials: false

      - name: Print workflow and source information
        shell: bash
        run: |
          set -euo pipefail
          echo "GGOTO_WORKFLOW=4.1-UI5.1-upgrade-signing-v1"
          echo "Official repository: antest1/GotoBrowser"
          echo "Official commit: 6e78d276f0c884e80c2a5a03a0de5973a42ae969"
          echo "Patch repository files:"
          find _patch_repo -maxdepth 4 -type f -not -path '*/.git/*' | sort | head -150

      - name: Verify official GotoBrowser 4.1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("_official")
          expected = {
              "app/build.gradle": "b12f67ae475a6033b9572396d6aa85b7dffbca4b164d567dea3292df6c12d90e",
              "app/src/main/java/com/antest1/gotobrowser/Browser/ResourceProcess.java": "ce24a99ec23445bd95e2671587e57defbf05b1bc64b8c7eaddd0519d9b177081",
              "app/src/main/java/com/antest1/gotobrowser/Browser/KcsInterface.java": "aaa9508ec62f2e7eb74d40c039c2a1041274a8f39e0967e1bb6d4ba629fd214a",
              "app/src/main/java/com/antest1/gotobrowser/Helpers/KcUtils.java": "c367148064f37eec189f8b800f62a78d7a0e78a344024e9744c40bee73620ae5",
              "app/src/main/java/com/antest1/gotobrowser/ui/component/SettingsBottomSheet.kt": "4541f9f3b9ca3666a57fe7d77b64101c0d4c662bf38ff3472dfe210b52c53901",
              "app/src/main/java/com/antest1/gotobrowser/Activity/BrowserActivity.kt": "6738bd45a356efed4da00b5c398e440dd6027eed99a241847c2b97d2d766907b",
              "app/src/main/java/com/antest1/gotobrowser/Constants.java": "cf03107b30fe355365d0574fd45a17ef340b38162dc2d23dd9770a582d8f8df8",
          }

          for rel, digest in expected.items():
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"::error::Missing official source file: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{rel}: {'OK' if actual == digest else 'MISMATCH'}")
              if actual != digest:
                  raise SystemExit(f"::error::Official 4.1 source hash mismatch: {rel}")

          print("Official GotoBrowser 4.1 source snapshot verified.")
          PY

      - name: Locate and apply GGoto UI5 auto day-night and import patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_NAME="Ggoto_41_UI5_AutoDayNight_Patch.zip"
          PATCH_ZIP="$(find _patch_repo -type f -name "$PATCH_NAME" -not -path '*/.git/*' -print -quit || true)"

          # Also accept the complete GitHub upload pack if it contains the patch ZIP.
          if [ -z "$PATCH_ZIP" ]; then
            while IFS= read -r OUTER_ZIP; do
              [ -n "$OUTER_ZIP" ] || continue
              unzip -Z1 "$OUTER_ZIP" > /tmp/ggoto-zip-list.txt 2>/dev/null || continue
              if grep -Eq '(^|/)Ggoto_41_UI5_AutoDayNight_Patch\.zip$' /tmp/ggoto-zip-list.txt; then
                echo "Found patch ZIP inside: $OUTER_ZIP"
                rm -rf _ggoto_outer
                mkdir -p _ggoto_outer
                unzip -q "$OUTER_ZIP" -d _ggoto_outer
                PATCH_ZIP="$(find _ggoto_outer -type f -name "$PATCH_NAME" -print -quit || true)"
                break
              fi
            done < <(find _patch_repo -maxdepth 4 -type f -name '*.zip' -not -path '*/.git/*' -print)
          fi

          if [ -z "$PATCH_ZIP" ]; then
            echo "::error title=GGoto patch ZIP missing::Upload Ggoto_41_UI5_AutoDayNight_Patch.zip to the repository root, or upload the complete GitHub upload pack."
            exit 2
          fi

          echo "Using patch ZIP: $PATCH_ZIP"
          rm -rf _ggoto_patch
          mkdir -p _ggoto_patch
          unzip -q "$PATCH_ZIP" -d _ggoto_patch

          PATCH_SCRIPT="$(find _ggoto_patch -type f -name 'patch_source41_daynight.py' -print -quit || true)"
          if [ -z "$PATCH_SCRIPT" ]; then
            echo "::error title=Patch script missing::The patch ZIP does not contain patch_source41_daynight.py."
            find _ggoto_patch -maxdepth 6 -type f -print
            exit 3
          fi

          echo "Applying patch script: $PATCH_SCRIPT"
          python3 "$PATCH_SCRIPT" "$GITHUB_WORKSPACE/_official"

          ACTIVITY="_official/app/src/main/java/com/antest1/gotobrowser/Activity/BrowserActivity.kt"
          SETTINGS="_official/app/src/main/java/com/antest1/gotobrowser/ui/component/SettingsBottomSheet.kt"
          GRADLE="_official/app/build.gradle"

          grep -Fq "PREF_MOD_GGOTO_PROFILE" "$ACTIVITY" || {
            echo "::error::GGoto profile preference was not added to BrowserActivity.kt"
            exit 4
          }
          grep -Fq "settings_mod_ggoto_profile" "$SETTINGS" || {
            echo "::error::GGoto profile selector was not added to SettingsBottomSheet.kt"
            exit 5
          }
          grep -Fq "settings_mod_ggoto_import_normal" "$SETTINGS" || {
            echo "::error::GGoto normal ZIP import action is missing"
            exit 6
          }
          grep -Fq "settings_mod_ggoto_import_day" "$SETTINGS" || {
            echo "::error::GGoto day ZIP import action is missing"
            exit 7
          }
          grep -Fq "settings_mod_ggoto_import_night" "$SETTINGS" || {
            echo "::error::GGoto night ZIP import action is missing"
            exit 8
          }
          test -f "_official/app/src/main/java/com/antest1/gotobrowser/Helpers/GGotoModImporter.java" || {
            echo "::error::GGotoModImporter.java was not installed"
            exit 9
          }
          POLICY="_official/app/src/main/java/com/antest1/gotobrowser/Helpers/GGotoDayNightPolicy.java"
          KCS="_official/app/src/main/java/com/antest1/gotobrowser/Browser/KcsInterface.java"
          test -f "$POLICY" || { echo "::error::GGotoDayNightPolicy.java missing"; exit 11; }
          grep -Fq "onPort(activity)" "$KCS" || { echo "::error::Port-return hook missing"; exit 12; }
          grep -Fq "TimePickerDialog" "$SETTINGS" || { echo "::error::Time picker UI missing"; exit 13; }
          grep -Fq "settings_mod_ggoto_day_start" "$SETTINGS" || { echo "::error::Day start setting missing"; exit 14; }
          grep -Fq "settings_mod_ggoto_night_start" "$SETTINGS" || { echo "::error::Night start setting missing"; exit 15; }
          grep -Fq "4.1-GGOTO-UI5" "$GRADLE" || {
            echo "::error::GGoto UI5 version marker was not added to app/build.gradle"
            exit 10
          }

          echo "UI5 timetable, port-return hook, importer, and all three import actions verified."

      - name: Set unique upgrade version code (keep app package ID)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          import os
          import re

          gradle = Path('_official/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          run_attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          # Stable and increasing per workflow run/retry. Greater than old 4.1 (94).
          version_code = 2000000 + run_number * 100 + run_attempt
          if version_code > 2100000000:
              raise SystemExit('::error::versionCode exceeded Android-safe range')

          if 'applicationId "com.antest1.gotobrowser"' not in text:
              raise SystemExit('::error::Application ID changed! Refusing update build')
          text, c1 = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$',
                             lambda m: f'{m.group(1)}versionCode {version_code}', text)
          text, c2 = re.subn(r'(?m)^(\s*)versionName\s+"4\.1-GGOTO-UI5"\s*$',
                             lambda m: f'{m.group(1)}versionName "4.1-GGOTO-UI5.1.{version_code}"', text)
          if c1 != 1 or c2 != 1:
              raise SystemExit(f'::error::Version fields mismatched: versionCode={c1}, versionName={c2}')

          # Use exactly the original key (stored as a GitHub secret) to sign debug.
          # The default Android debug alias and passwords are supported, as are
          # custom alias/password secrets if the installed version used them.
          text += """

          // GGOTO-UI5.1: stable upgrade signing; never change the package ID.
          android {
              signingConfigs {
                  ggotoExistingKey {
                      storeFile file(System.getenv('GGOTO_SIGNING_FILE'))
                      storePassword (System.getenv('GGOTO_KEYSTORE_PASSWORD') ?: 'android')
                      keyAlias (System.getenv('GGOTO_KEY_ALIAS') ?: 'androiddebugkey')
                      keyPassword (System.getenv('GGOTO_KEY_PASSWORD') ?: 'android')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.ggotoExistingKey
                  }
              }
          }
          """
          gradle.write_text(text, encoding='utf-8')
          print('Application ID : com.antest1.gotobrowser (unchanged)')
          print('versionCode    :', version_code)
          print('versionName    :', f'4.1-GGOTO-UI5.1.{version_code}')
          PYVERSION

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: _official/**/*.gradle*

      - name: Require your existing APK signing certificate (for overwrite installation)
        shell: bash
        env:
          GGOTO_DEBUG_KEYSTORE_B64: ${{ secrets.GGOTO_DEBUG_KEYSTORE_B64 }}
          GGOTO_KEYSTORE_PASSWORD: ${{ secrets.GGOTO_KEYSTORE_PASSWORD }}
          GGOTO_KEY_ALIAS: ${{ secrets.GGOTO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${GGOTO_DEBUG_KEYSTORE_B64:-}" ]; then
            echo '::error title=Original signing key required::To overwrite an existing Android APK, upload its ORIGINAL keystore as GitHub Actions repository secret GGOTO_DEBUG_KEYSTORE_B64 (base64). A new key or a generated debug key cannot update an APK signed by another key.'
            echo 'If the original private key is unrecoverable, you must uninstall the old app once (back up your data first); future updates can then reuse a persistent key.'
            exit 20
          fi

          mkdir -p "$RUNNER_TEMP/ggoto-signing"
          KEY_FILE="$RUNNER_TEMP/ggoto-signing/original-key.jks"
          printf '%s' "$GGOTO_DEBUG_KEYSTORE_B64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if [ ! -s "$KEY_FILE" ]; then
            echo '::error::Keystore secret decoded to an empty file.'
            exit 21
          fi
          KEYSTORE_PASSWORD="${GGOTO_KEYSTORE_PASSWORD:-android}"
          KEY_ALIAS="${GGOTO_KEY_ALIAS:-androiddebugkey}"
          if ! keytool -list -keystore "$KEY_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo '::error::Cannot open original keystore or locate alias. Check GGOTO_KEYSTORE_PASSWORD and GGOTO_KEY_ALIAS repository secrets.'
            exit 22
          fi
          echo "GGOTO_SIGNING_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo 'Existing signing keystore verified. No new signing key generated.'

      - name: Build Ggotobrowser APK
        working-directory: _official
        shell: bash
        env:
          GGOTO_KEYSTORE_PASSWORD: ${{ secrets.GGOTO_KEYSTORE_PASSWORD }}
          GGOTO_KEY_ALIAS: ${{ secrets.GGOTO_KEY_ALIAS }}
          GGOTO_KEY_PASSWORD: ${{ secrets.GGOTO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "Starting full Android debug build with original signing key..."
          ./gradlew --no-daemon clean assembleDebug --stacktrace
          echo "Gradle assembleDebug completed."

      - name: Verify APK output
        id: verify_apk
        shell: bash
        env:
          GGOTO_KEYSTORE_PASSWORD: ${{ secrets.GGOTO_KEYSTORE_PASSWORD }}
          GGOTO_KEY_ALIAS: ${{ secrets.GGOTO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_DIR="_official/app/build/outputs/apk/debug"
          echo "Searching for APK files in: $APK_DIR"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error title=APK output directory missing::Gradle did not create app/build/outputs/apk/debug."
            echo "Available build output directories:"
            find _official/app/build/outputs -maxdepth 5 -type d -print 2>/dev/null || true
            exit 7
          fi

          find "$APK_DIR" -type f -name '*.apk' -print
          APK_FILE="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error title=APK not generated::No APK file was found after assembleDebug."
            exit 8
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "APK ready: $APK_FILE"
          echo "APK size: $(du -h "$APK_FILE" | cut -f1)"
          if [ -n "${ANDROID_HOME:-}" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -1 || true)"
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK_FILE"
              if [ -n "${GGOTO_SIGNING_FILE:-}" ] && [ -f "$GGOTO_SIGNING_FILE" ]; then
                EXPECTED_CERT_SHA="$(keytool -exportcert -keystore "$GGOTO_SIGNING_FILE" -storepass "${GGOTO_KEYSTORE_PASSWORD:-android}" -alias "${GGOTO_KEY_ALIAS:-androiddebugkey}" | sha256sum | awk '{print $1}')"
                ACTUAL_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK_FILE" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
                if [ -z "$ACTUAL_CERT_SHA" ] || [ "$EXPECTED_CERT_SHA" != "$ACTUAL_CERT_SHA" ]; then
                  echo '::error::APK signature does not match the signing key supplied via GGOTO_DEBUG_KEYSTORE_B64.'
                  exit 24
                fi
                echo 'APK signing certificate matches the supplied original keystore.'
              fi
            else
              echo 'Android apksigner was not found; Gradle already signed the debug output.'
            fi
            if [ -n "$AAPT" ]; then
              BADGING="$("$AAPT" dump badging "$APK_FILE")"
              echo "$BADGING" | grep '^package:'
              echo "$BADGING" | grep -q "package: name='com.antest1.gotobrowser'" || {
                echo '::error::APK package ID changed; cannot upgrade existing app.'
                exit 23
              }
            fi
          fi
          {
            echo "## GGoto build result"
            echo ""
            echo "- Source: GotoBrowser 4.1"
            echo "- Source commit: 6e78d276f0c884e80c2a5a03a0de5973a42ae969"
            echo "- APK: $APK_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ggotobrowser APK
        uses: actions/upload-artifact@v6
        with:
          name: Ggotobrowser-4.1-UI5.1-UpgradeInstall-APK
          path: _official/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
